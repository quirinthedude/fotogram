<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotogram</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>

  <header>
    <h1>
      <img src="img/Fotogram_Logo.svg" class="fotogram_logo" alt="Fotogram_Logo">
    </h1>
  </header>

  <main>
    <section class="gallery">
      <h2>Bildergalerie von Litchi und Kiwi</h2>
      <div id="thumbnail_container">
        <!-- Thumbnails werden per JavaScript eingefügt -->
      </div>
    </section>

    <dialog id="lightbox" aria-modal="true" role="dialog" aria-labelledby="lightbox_caption" onclick="if (event.target === this) closeLightbox()">
      <figure>
        <div class="media">
          <img id="lightbox_img" alt="">
          <button id="close_btn" onclick="closeLightbox()" aria-label="Detailansicht schließen">×</button>
          <button id="prev_btn" onclick="prevButton()" aria-label="Vorheriges Bild">⟨</button>
          <button id="next_btn" onclick="nextButton()" aria-label="Nächstes Bild">⟩</button>
        </div>
        <figcaption id="lightbox_caption"></figcaption>
      </figure>
    </dialog>


  </main>

  <footer>
    <p>&copy; 2025 Fotogram</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
